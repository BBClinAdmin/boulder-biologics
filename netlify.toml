  to = "https://boulderbiologics.com/our-clinic"
  status = 301

# ── Canonical host: force apex, redirect www → apex ──
# MUST STAY LAST. Rules are matched in order, so the specific path rules above
# get first look and can send a www request straight to its final apex URL in a
# single hop. If this block moves back to the top, every old-URL hit on the www
# host chains through it and takes two hops instead of one.
# ── Canonical host: force apex (boulderbiologics.com), redirect www → apex ──
[[redirects]]
  from = "https://www.boulderbiologics.com/*"
  to = "https://boulderbiologics.com/:splat"
  status = 301
  force = true

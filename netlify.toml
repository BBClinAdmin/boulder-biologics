# Netlify configuration — Boulder Biologics marketing site
# Static site, no build step. Files are served from the repo root.

[build]
  publish = "."

# Pretty/clean URLs: serve /cellular-therapy from cellular-therapy.html and
# 301 the .html form to the clean URL.
[build.processing.html]
  pretty_urls = true

# ─────────────────────────────────────────────────────────────────────────
# Caching: static assets (images, video, fonts, JS/CSS) rarely change, so let
# browsers reuse them instead of re-downloading on every visit / page nav.
# Filenames are NOT fingerprinted, so we use a 1-day fresh window plus a 7-day
# stale-while-revalidate tail: an updated asset reaches new visitors within a
# day, while repeat visitors serve from cache (zero Netlify bandwidth).
# HTML is intentionally left on Netlify's default (revalidated each request)
# so content edits go live immediately.
# ─────────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"


